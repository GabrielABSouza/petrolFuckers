[project]
name = "radar-pid-api"
version = "0.1.0"
description = "API pública do Radar PID — score MCDA municipal de transição energética"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<0.120",
    "uvicorn[standard]>=0.27,<0.40",
    "pandas>=2.0,<3.0",
    "pyarrow>=14,<20",
    "pydantic>=2.5,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
